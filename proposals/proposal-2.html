<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vouch — The Seam</title>
<!--
  DNA-A-S-S-M-S   Asymmetric · Side nav · Split hero · Monochrome · Sans
  STANCE: Laboratory Assay. Two panels, one seam. Everything the registry asserts lives
  left of the seam and is held at low contrast; everything the chain records lives right
  of it at full contrast. The argument is spatial before it is verbal.
  INSPIRATION: Linear (near-black ground, accent as marker never fill, hairline borders)
             + Swiss editorial column rules.
  SIGNATURE ELEMENT: The seam. A single vertical rule runs the full height of the list.
  Each agent's two halves butt against it. Where a claim outruns its evidence the seam
  grows a gold notch at that row — the only place gold is ever used.

  UX ARCHITECTURE
  Entry: side rail category, list opens on the first category.
  Exit:  a session granted, or a decision that nothing here qualifies.
  Screens: 1. Assay list (compare, primary action: expand)
           2. Expanded row (full evidence + authority, primary action: hire)
           3. Hire sheet (scope, cap, expiry, primary action: grant)
  Happy path: pick category > scan seam for notches > expand > hire
  States: empty says which filter emptied it; loading shows seam + ghost rows;
          error names the source that failed and offers a retry.
  Kill-switch: the side rail is four items and never grows; no settings screen exists.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gray-0:#08090B;--gray-1:#0D0F13;--gray-2:#12151A;--gray-3:#171B21;--gray-4:#1E232B;
  --gray-5:#2A313B;--gray-6:#3D4652;--gray-7:#5A6674;--gray-8:#8B97A6;--gray-9:#C6CED8;--gray-10:#EEF2F6;
  --gold:#F0B90B;--gold-32:rgba(240,185,11,.32);--gold-12:rgba(240,185,11,.12);
  --bg:var(--gray-0);--surface:var(--gray-1);--border:var(--gray-4);--border-subtle:var(--gray-3);
  --text:var(--gray-10);--muted:var(--gray-8);--faint:var(--gray-7);
  --claim:var(--gray-7);--measured:var(--gray-10);
  --sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:48px;
  --r-control:6px;--r-card:10px;--m-fast:120ms;--m-base:180ms;--ease:cubic-bezier(0,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold-32);border-radius:var(--r-control)}

.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
aside{border-right:1px solid var(--border-subtle);padding:var(--s6) var(--s5);position:sticky;top:0;height:100vh}
.brand{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s2)}
.brand span{color:var(--gold)}
.tag{font-family:var(--mono);font-size:12px;color:var(--faint);line-height:1.5;margin-bottom:var(--s7);
  letter-spacing:.02em}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{text-align:left;background:none;border:none;color:var(--muted);font:inherit;font-size:14px;
  padding:10px var(--s3);border-radius:var(--r-control);cursor:pointer;min-height:44px;
  display:flex;justify-content:space-between;align-items:center;
  transition:background var(--m-fast) var(--ease),color var(--m-fast) var(--ease)}
@media (hover:hover){aside nav button:hover{background:var(--gray-2);color:var(--text)}}
aside nav button[aria-selected=true]{background:var(--gold-12);color:var(--text)}
aside nav .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.rail-foot{position:absolute;bottom:var(--s6);left:var(--s5);right:var(--s5);
  font-family:var(--mono);font-size:12px;color:var(--faint);line-height:1.6}
.dot{width:6px;height:6px;border-radius:50%;background:#3FB950;display:inline-block;margin-right:6px}

main{padding:var(--s7) var(--s8) var(--s8);min-width:0}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--s8);align-items:end;
  padding-bottom:var(--s7);border-bottom:1px solid var(--border-subtle);margin-bottom:var(--s6)}
h1{font-size:34px;line-height:1.14;letter-spacing:-.025em;margin:0;font-weight:500;max-width:18ch}
h1 em{font-style:normal;color:var(--gold)}
.stat{text-align:right}
.stat .big{font-family:var(--mono);font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em}
.stat .cap{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);margin-top:var(--s2);max-width:26ch;margin-left:auto;line-height:1.5}

.heads{display:grid;grid-template-columns:1fr 1px 1fr;gap:var(--s5);
  font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);padding-bottom:var(--s3)}
.heads .right{text-align:left}
/* SIGNATURE: the seam */
.list{position:relative}
.seam{position:absolute;left:calc(50% - .5px);top:0;bottom:0;width:1px;background:var(--border);z-index:1}
.rw{display:grid;grid-template-columns:1fr 1px 1fr;gap:var(--s5);padding:var(--s4) 0;
  border-bottom:1px solid var(--border-subtle);position:relative;
  transition:background var(--m-fast) var(--ease)}
@media (hover:hover){.rw:hover{background:var(--surface)}}
.notch{position:relative;z-index:2}
.notch::before{content:'';position:absolute;left:-3px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;background:var(--gold);border-radius:50%;border:2px solid var(--bg);opacity:0}
.rw.disputed .notch::before{opacity:1}
.side{min-width:0}
.side.claim{color:var(--claim);text-align:right}
.side.chain{color:var(--measured)}
.side h3{margin:0 0 var(--s2);font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--text)}
.side.claim h3{color:var(--claim);font-weight:400}
.kv{font-family:var(--mono);font-size:13px;line-height:1.75;letter-spacing:.01em}
.kv b{font-weight:500}
.kv .u{color:var(--faint);font-size:12px;letter-spacing:.05em}
.flag{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-32);border-radius:4px;
  padding:1px 6px;margin-top:var(--s2)}
.badge{position:fixed;right:14px;bottom:14px;font-family:var(--mono);font-size:12px;color:var(--faint);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-control);padding:6px 10px;letter-spacing:.06em}
.ghost{height:15px;background:var(--gray-2);border-radius:3px;animation:p 1.4s var(--ease) infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;border-right:none;
  border-bottom:1px solid var(--border-subtle)}aside nav{flex-direction:row;flex-wrap:wrap}.rail-foot{position:static;margin-top:var(--s4)}
  main{padding:var(--s5)}.split{grid-template-columns:1fr;gap:var(--s5)}.stat{text-align:left}.stat .cap{margin-left:0}
  .heads,.rw{grid-template-columns:1fr}.seam{display:none}.side.claim{text-align:left}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">Vouch<span>/</span></div>
    <div class="tag">Claim on the left.<br>Chain on the right.</div>
    <nav id="nav"></nav>
    <div class="rail-foot"><span class="dot"></span>block <span class="num" id="blk">…</span><br>105 agents measured</div>
  </aside>
  <main>
    <div class="split">
      <h1>Every listing, held against <em>what the chain records</em>.</h1>
      <div class="stat">
        <div class="big num">−0.065</div>
        <div class="cap">correlation between registry score and transactions actually sent</div>
      </div>
    </div>
    <div class="heads"><span style="text-align:right">Registry claims</span><span></span><span class="right">Chain says</span></div>
    <div class="list"><div class="seam"></div><div id="rows"></div></div>
  </main>
</div>
<div class="badge">DNA-A-S-S-M-S · The Seam</div>

<script type="module">
const CATS=[['rebalancing','Rebalancing'],['grid','Grid'],['yield','Yield'],['health','Health factor']];
const B='https://yonkoo11.github.io/vouch/data/';
let DATA={},active='rebalancing';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('https://bsc-dataseed.binance.org',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_blockNumber',params:[]})})
  .then(r=>r.json()).then(j=>blk.textContent=parseInt(j.result,16).toLocaleString()).catch(()=>blk.textContent='—');

function render(){
  nav.innerHTML=CATS.map(([id,l])=>`<button data-id="${id}" aria-selected="${id===active}">${l}<span class="n">${DATA[id]?DATA[id].items.length:'–'}</span></button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});
  const d=DATA[active];
  if(!d){rows.innerHTML=Array.from({length:7},()=>'<div class="rw"><div class="ghost"></div><div></div><div class="ghost"></div></div>').join('');return;}
  const sorted=[...d.items].sort((a,b)=>(b.onchain?.txs??0)-(a.onchain?.txs??0));
  rows.innerHTML=sorted.map(a=>{
    const oc=a.onchain||{},h=a.history||{},ev=a.evidence||{},f=a.flags||{};
    const disputed=f.category_supported===false||(h.idle_days>30)||(oc.txs??0)<5;
    return `<div class="rw ${disputed?'disputed':''}">
      <div class="side claim">
        <h3>${esc(a.name||'Unnamed agent')}</h3>
        <div class="kv"><b class="num">${(a.total_score??0).toFixed(2)}</b> <span class="u">score</span></div>
        <div class="kv">${a.total_feedbacks?`<b class="num">${a.total_feedbacks}</b> <span class="u">feedbacks</span>`:'<span class="u">no feedback recorded</span>'}</div>
        <div class="kv"><span class="u">${a.is_endpoint_verified===false?'endpoint unverified':'endpoint ok'}</span></div>
      </div>
      <div class="notch"></div>
      <div class="side chain">
        <h3 style="visibility:hidden;height:0;margin:0">.</h3>
        <div class="kv"><b class="num">${(oc.txs??0).toLocaleString()}</b> <span class="u">transactions sent</span></div>
        <div class="kv">${h.idle_days==null?'<span class="u">never active</span>':`<b class="num">${h.idle_days<1?'today':Math.round(h.idle_days)+'d'}</b> <span class="u">since last active</span>`}</div>
        <div class="kv">${ev.lp?`<b class="num">${ev.lp.live}</b> <span class="u">live of ${ev.lp.held} positions</span>`:'<span class="u">no position held</span>'}</div>
        ${disputed?`<span class="flag">claim outruns evidence</span>`:''}
      </div>
    </div>`;
  }).join('');
}
render();
Promise.all(CATS.map(([id])=>fetch(B+id+'.json').then(r=>r.json()).then(j=>DATA[id]=j))).then(render)
  .catch(()=>rows.innerHTML='<div class="rw"><div>Evidence files unreachable. Nothing is shown rather than invented.</div></div>');
</script>
</body>
</html>
